<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANITAS-AI - نظام ذكاء اصطناعي متقدم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --secondary-color: #ec4899;
            --bg-dark: #0f172a;
            --bg-light: #ffffff;
            --text-dark: #1e293b;
            --text-light: #f1f5f9;
            --border-color: #e2e8f0;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode {
            --bg-light: #1e293b;
            --text-dark: #f1f5f9;
            --border-color: #334155;
            --bg-dark: #0f172a;
        }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            height: 90vh;
            background: var(--bg-light);
            border-radius: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header-content .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .header-content .logo i {
            font-size: 32px;
        }

        .header-content h1 {
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }

        .tagline {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        /* Chat Container */
        .chat-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        /* Chat History */
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg-light);
        }

        .chat-history::-webkit-scrollbar {
            width: 8px;
        }

        .chat-history::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-history::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 4px;
        }

        .chat-history::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-color);
        }

        /* Welcome Message */
        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-dark);
        }

        .welcome-message i {
            font-size: 64px;
            color: var(--primary-color);
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .welcome-message h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .welcome-message p {
            font-size: 14px;
            opacity: 0.7;
            max-width: 400px;
            margin: 0 auto;
        }

        /* Message Styles */
        .message {
            display: flex;
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-content {
            background: #f1f5f9;
            color: var(--text-dark);
            border-bottom-left-radius: 4px;
        }

        body.dark-mode .message.ai .message-content {
            background: #334155;
            color: var(--text-light);
        }

        /* Input Area */
        .input-area {
            background: var(--bg-light);
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        textarea#userInput {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            max-height: 100px;
            color: var(--text-dark);
            background: var(--bg-light);
        }

        body.dark-mode textarea#userInput {
            background: #334155;
            color: var(--text-light);
            border-color: #475569;
        }

        textarea#userInput:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .send-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .info-text {
            font-size: 12px;
            opacity: 0.5;
            text-align: center;
            margin-top: 8px;
            color: var(--text-dark);
        }

        /* Settings Sidebar */
        .settings-sidebar {
            position: fixed;
            right: -350px;
            top: 0;
            width: 350px;
            height: 100vh;
            background: var(--bg-light);
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.2);
            transition: right 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
        }

        .settings-sidebar.open {
            right: 0;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .settings-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .close-btn:hover {
            transform: scale(1.2);
        }

        .settings-content {
            padding: 20px;
        }

        .setting-group {
            margin-bottom: 25px;
        }

        .setting-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .theme-toggle {
            display: flex;
            gap: 10px;
        }

        .theme-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--border-color);
            background: var(--bg-light);
            color: var(--text-dark);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 13px;
        }

        .theme-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .theme-btn:hover {
            border-color: var(--primary-color);
        }

        #speedSlider {
            width: 100%;
            cursor: pointer;
            margin-bottom: 10px;
        }

        #speedValue {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .clear-btn {
            width: 100%;
            padding: 12px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }

        .clear-btn:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        /* Settings Button */
        .settings-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
            transition: all 0.3s;
            z-index: 500;
        }

        .settings-btn:hover {
            transform: scale(1.1) rotate(90deg);
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                max-width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }

            .settings-sidebar {
                width: 100%;
                right: -100%;
            }

            .settings-btn {
                bottom: 20px;
                left: 20px;
                width: 45px;
                height: 45px;
                font-size: 18px;
            }

            .header-content h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-brain"></i>
                    <h1>VANITAS-AI</h1>
                </div>
                <p class="tagline">نظام ذكاء اصطناعي متقدم</p>
            </div>
        </header>

        <!-- Main Chat Container -->
        <div class="chat-container">
            <!-- Chat History -->
            <div class="chat-history" id="chatHistory">
                <div class="welcome-message">
                    <i class="fas fa-robot"></i>
                    <h2>مرحباً بك في VANITAS-AI</h2>
                    <p>أنا هنا لمساعدتك في أي سؤال أو مشكلة. كيف أستطيع مساعدتك اليوم؟</p>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea 
                        id="userInput" 
                        placeholder="اكتب رسالتك هنا..." 
                        rows="2"
                    ></textarea>
                    <button id="sendBtn" class="send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="info-text">اضغط Enter + Shift للرسالة التالية، أو انقر الزر لإرسال</div>
            </div>
        </div>

        <!-- Settings Sidebar -->
        <div class="settings-sidebar" id="settingsSidebar">
            <div class="settings-header">
                <h3>الإعدادات</h3>
                <button id="closeSettings" class="close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="settings-content">
                <div class="setting-group">
                    <label>وضع الألوان:</label>
                    <div class="theme-toggle">
                        <button id="lightMode" class="theme-btn active">
                            <i class="fas fa-sun"></i> فاتح
                        </button>
                        <button id="darkMode" class="theme-btn">
                            <i class="fas fa-moon"></i> غامق
                        </button>
                    </div>
                </div>
                <div class="setting-group">
                    <label>سرعة الاستجابة:</label>
                    <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1">
                    <span id="speedValue">1x</span>
                </div>
                <button id="clearChat" class="clear-btn">
                    <i class="fas fa-trash"></i> مسح المحادثة
                </button>
            </div>
        </div>

        <!-- Settings Button -->
        <button id="settingsBtn" class="settings-btn">
            <i class="fas fa-cog"></i>
        </button>
    </div>

    <script>
        // DOM Elements
        const chatHistory = document.getElementById('chatHistory');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsSidebar = document.getElementById('settingsSidebar');
        const closeSettings = document.getElementById('closeSettings');
        const lightModeBtn = document.getElementById('lightMode');
        const darkModeBtn = document.getElementById('darkMode');
        const clearChatBtn = document.getElementById('clearChat');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');

        // State
        let isTyping = false;
        let messageSpeed = 1;

        // Knowledge Base
        const knowledgeBase = {
            "مرحبا": [
                "مرحباً بك! أنا هنا لمساعدتك 😊",
                "مرحباً! كيف يمكنني مساعدتك؟",
                "أهلاً وسهلاً! ما الذي تحتاج إليه؟"
            ],
            "السلام عليكم": [
                "عليكم السلام ورحمة الله وبركاته",
                "وعليكم السلام ورحمة الله وبركاته 👋"
            ],
            "صباح الخير": [
                "صباح الخير! أتمنى أن تكون بألف خير",
                "صباح الخير والنور! كيف حالك؟"
            ],
            "مساء الخير": [
                "مساء الخير! أتمنى أن تكون بألف خير",
                "مساء الخير والنور! 🌙"
            ],
            "ما اسمك": [
                "أنا VANITAS-AI، نظام ذكاء اصطناعي مساعد 🤖",
                "اسمي VANITAS-AI، سعيد بالتعرف عليك!"
            ],
            "من أنت": [
                "أنا VANITAS-AI، متخصص في الإجابة على الأسئلة",
                "أنا مساعد ذكي متطور لمساعدتك في كل شيء"
            ],
            "كيفك": [
                "أنا بخير، شكراً على السؤال! 😊",
                "بخير جداً، كيف حالك أنت؟"
            ],
            "شكرا": [
                "على الرحب والسعة! 😊",
                "يسعدني أن أكون قد ساعدتك",
                "الشكر لك على لطفك"
            ],
            "وداعا": [
                "إلى اللقاء! آمل أن أكون قد ساعدتك 👋",
                "وداعاً، تحياتي لك",
                "إلى اللقاء ويسعدني تحدثنا معاً"
            ],
            "مساعدة": [
                "أنا هنا لمساعدتك! يمكنك سؤالي عن أي شيء",
                "بكل سرور! ما الذي تحتاج إليه؟"
            ],
            "كيف حالك": [
                "أنا بخير، شكراً على السؤال! وأنت كيف حالك؟",
                "بألف خير، شكراً لاهتمامك"
            ],
            "ما الوقت": [
                `الوقت الآن: ${new Date().toLocaleTimeString('ar-EG')}`,
                "أتمنى أن تكون كل لحظة من وقتك سعيدة! ⏰"
            ],
            "ما التاريخ": [
                `التاريخ اليوم: ${new Date().toLocaleDateString('ar-EG')}`,
                "اليوم يوم جميل! 📅"
            ],
            "ما هو دورك": [
                "دوري مساعدتك والإجابة على أسئلتك وتقديم المشورة",
                "أنا هنا لجعل حياتك أسهل وأكثر إنتاجية"
            ],
            "هل يمكنك": [
                "نعم! أستطيع مساعدتك في الكثير من الأشياء، جرب سؤالي",
                "بالتأكيد! أنا هنا لمساعدتك"
            ]
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            setupEventListeners();
        });

        // Setup Event Listeners
        function setupEventListeners() {
            sendBtn.addEventListener('click', sendMessage);
            userInput.addEventListener('keydown', handleKeyPress);
            settingsBtn.addEventListener('click', toggleSettings);
            closeSettings.addEventListener('click', toggleSettings);
            lightModeBtn.addEventListener('click', setLightMode);
            darkModeBtn.addEventListener('click', setDarkMode);
            clearChatBtn.addEventListener('click', clearChat);
            speedSlider.addEventListener('input', updateSpeed);
            userInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 100) + 'px';
            });
        }

        // Send Message
        async function sendMessage() {
            const message = userInput.value.trim();
            
            if (!message || isTyping) return;
            
            addMessage(message, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';
            
            isTyping = true;
            
            try {
                const response = await getAIResponse(message);
                addMessage(response, 'ai');
            } catch (error) {
                console.error('Error:', error);
                addMessage('عذراً، حدث خطأ. حاول مرة أخرى!', 'ai');
            }
            
            isTyping = false;
        }

        // Handle Key Press
        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // Add Message to Chat
        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            
            messageDiv.appendChild(contentDiv);
            chatHistory.appendChild(messageDiv);
            
            const welcomeMsg = chatHistory.querySelector('.welcome-message');
            if (welcomeMsg && chatHistory.children.length > 1) {
                welcomeMsg.remove();
            }
            
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // Get AI Response
        async function getAIResponse(message) {
            const messageLower = message.toLowerCase();
            
            // Check knowledge base
            for (const [keyword, responses] of Object.entries(knowledgeBase)) {
                if (messageLower.includes(keyword)) {
                    return responses[Math.floor(Math.random() * responses.length)];
                }
            }
            
            // Default response
            const defaultResponses = [
                `سؤال مثير للاهتمام! 🤔 بخصوص: "${message}"`,
                `شكراً على هذا السؤال! هذا موضوع مهم جداً`,
                `معلومة جيدة! هل لديك أسئلة أخرى؟`,
                `أشكرك على هذا الاستفسار المهم!`,
                `هذا سؤال ذكي جداً! 👍`
            ];
            
            return defaultResponses[Math.floor(Math.random() * defaultResponses.length)];
        }

        // Toggle Settings
        function toggleSettings() {
            settingsSidebar.classList.toggle('open');
        }

        // Theme Management
        function setLightMode() {
            document.body.classList.remove('dark-mode');
            lightModeBtn.classList.add('active');
            darkModeBtn.classList.remove('active');
            localStorage.setItem('theme', 'light');
        }

        function setDarkMode() {
            document.body.classList.add('dark-mode');
            darkModeBtn.classList.add('active');
            lightModeBtn.classList.remove('active');
            localStorage.setItem('theme', 'dark');
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                setDarkMode();
            } else {
                setLightMode();
            }
        }

        // Clear Chat
        function clearChat() {
            if (confirm('هل أنت متأكد من حذف جميع الرسائل؟')) {
                chatHistory.innerHTML = `
                    <div class="welcome-message">
                        <i class="fas fa-robot"></i>
                        <h2>مرحباً بك في VANITAS-AI</h2>
                        <p>أنا هنا لمساعدتك في أي سؤال أ�� مشكلة. كيف أستطيع مساعدتك اليوم؟</p>
                    </div>
                `;
                toggleSettings();
            }
        }

        // Update Speed
        function updateSpeed(e) {
            messageSpeed = parseFloat(e.target.value);
            speedValue.textContent = messageSpeed.toFixed(1) + 'x';
        }

        // Close settings when clicking outside
        document.addEventListener('click', function(e) {
            if (!settingsSidebar.contains(e.target) && 
                !settingsBtn.contains(e.target) && 
                settingsSidebar.classList.contains('open')) {
                toggleSettings();
            }
        });
    </script>
</body>
</html>
